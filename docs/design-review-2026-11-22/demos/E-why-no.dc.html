<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>E · למה לא?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Rubik:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff8f4}
button,input{font-family:inherit}
a{color:#4f5fb0}a:hover{color:#3a3560}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 20px 24px; background: #fff8f4; color: #3a3560; font-family: Rubik, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; margin-bottom: 8px">
<div style="display: flex; align-items: center; gap: 6px">
<svg viewBox="0 0 160 170" width="28" height="30" aria-hidden="true"><g stroke="#ffcf70" stroke-width="12" stroke-linecap="round"><line x1="138" y1="95" x2="150" y2="95"></line><line x1="121.01" y1="136.01" x2="129.5" y2="144.5"></line><line x1="80" y1="153" x2="80" y2="165"></line><line x1="38.99" y1="136.01" x2="30.5" y2="144.5"></line><line x1="22" y1="95" x2="10" y2="95"></line><line x1="38.99" y1="53.99" x2="30.5" y2="45.5"></line><line x1="80" y1="37" x2="80" y2="25"></line><line x1="121.01" y1="53.99" x2="129.5" y2="45.5"></line></g><path d="M80 47 A48 48 0 0 0 80 143 Z" fill="#f7a9a8"></path><path d="M80 47 A48 48 0 0 1 80 143 Z" fill="#a6b8f0"></path><g fill="#3a3560"><ellipse cx="62" cy="89" rx="6.5" ry="8"></ellipse><ellipse cx="98" cy="89" rx="6.5" ry="8"></ellipse></g><path d="M71 104 Q80 115 89 104 Z" fill="#3a3560"></path></svg>
<span style="font-family: Fredoka, Rubik, sans-serif; font-size: 22px; font-weight: 600"><span style="color: #e8807f">שֵׁמְ</span><span style="color: #7a92e2">אץ׳</span></span>
</div>
<button style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #f0e2dc; background: #ffffff; color: #3a3560; font-size: 14px; display: flex; align-items: center; gap: 6px">אפשרויות<svg width="16" height="16" viewBox="0 0 24 24" fill="#3a3560" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></button>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; margin-bottom: 8px">
<h1 style="margin: 0; font-family: Fredoka, Rubik, sans-serif; font-size: 18px; font-weight: 600">סבב 1 מתוך 3</h1>
<div style="display: flex; align-items: center; gap: 8px">
<span style="width: 8px; height: 8px; border-radius: 999px; background: #f7a9a8"></span>
<span style="width: 24px; height: 8px; border-radius: 999px; background: #b84a57"></span>
<span style="width: 8px; height: 8px; border-radius: 999px; background: #f0e2dc"></span>
<span style="width: 8px; height: 8px; border-radius: 999px; background: #f0e2dc"></span>
<span style="font-size: 12px; color: #625d86">שם 2 מתוך 4</span>
</div>
</div>

<section style="background: #ffffff; border-radius: 24px; padding: 20px; border: 1px solid #f0e2dc; box-shadow: 0 1px 2px rgba(58,53,96,0.06); display: flex; flex-direction: column; gap: 14px">
<div>
<h2 style="margin: 0; font-family: Fredoka, Rubik, sans-serif; font-size: 48px; font-weight: 600; line-height: 1.15">נֹגַהּ</h2>
<p style="margin: 0; font-size: 14px; color: #625d86">Noga · מקום 38 בין הבנות</p>
</div>
<p style="margin: 0; font-size: 16px; line-height: 24px">אור וזוהר, וגם שם כוכב הלכת. קצר וקל לאיות.</p>

<div role="radiogroup" aria-label="הדירוג של נגה" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button role="radio" aria-checked="true" style="min-height: 44px; border-radius: 16px; border: 2px solid #3a3560; background: #3a3560; color: #ffffff; font-size: 14px; font-weight: 500">לא</button>
<button role="radio" aria-checked="false" style="min-height: 44px; border-radius: 16px; border: 2px solid #f0e2dc; background: #ffffff; color: #3a3560; font-size: 14px; font-weight: 500">אולי</button>
<button role="radio" aria-checked="false" style="min-height: 44px; border-radius: 16px; border: 2px solid #f0e2dc; background: #ffffff; color: #3a3560; font-size: 14px; font-weight: 500">מעניין!</button>
</div>

<div style="display: flex; align-items: center; gap: 8px">
<svg viewBox="0 0 160 170" width="30" height="32" aria-hidden="true"><g stroke="#ffcf70" stroke-width="12" stroke-linecap="round"><line x1="138" y1="95" x2="150" y2="95"></line><line x1="121.01" y1="136.01" x2="129.5" y2="144.5"></line><line x1="80" y1="153" x2="80" y2="165"></line><line x1="38.99" y1="136.01" x2="30.5" y2="144.5"></line><line x1="22" y1="95" x2="10" y2="95"></line><line x1="38.99" y1="53.99" x2="30.5" y2="45.5"></line><line x1="80" y1="37" x2="80" y2="25"></line><line x1="121.01" y1="53.99" x2="129.5" y2="45.5"></line></g><path d="M80 47 A48 48 0 0 0 80 143 Z" fill="#f7a9a8"></path><path d="M80 47 A48 48 0 0 1 80 143 Z" fill="#a6b8f0"></path><g fill="#3a3560"><ellipse cx="62" cy="89" rx="6.5" ry="8"></ellipse><ellipse cx="98" cy="89" rx="6.5" ry="8"></ellipse></g><path d="M70 110 Q80 102 90 110" fill="none" stroke="#3a3560" stroke-width="5" stroke-linecap="round"></path></svg>
<p style="margin: 0; padding: 8px 14px; border-radius: 999px; border: 1px solid #f0e2dc; background: #ffffff; font-size: 14px">הבנתי. מה לא הסתדר?</p>
</div>

<div role="group" aria-label="סיבות" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{ reasons }}" as="r" hint-placeholder-count="7">
<button onClick="{{ r.toggle }}" aria-pressed="{{ r.on }}" style="{{ r.style }}">{{ r.label }}</button>
</sc-for>
</div>

<sc-if value="{{ showOther }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 4px">
<label for="why-other" style="font-size: 12px; color: #625d86">במילים שלכם</label>
<input id="why-other" type="text" placeholder="למשל: דומה מדי לנועה מהגן" style="min-height: 44px; box-sizing: border-box; border-radius: 14px; border: 2px solid #f0e2dc; padding: 0 12px; font-size: 14px; color: #3a3560; background: #ffffff">
</div>
</sc-if>

<sc-if value="{{ hasLearned }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; border-radius: 14px; background: #eaeefc; color: #3a3560; font-size: 13px; line-height: 19px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4f5fb0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><path d="M12 3v3M18.4 5.6l-2.1 2.1M21 12h-3M5.6 5.6l2.1 2.1M3 12h3"></path><path d="M9 17a3 3 0 1 1 6 0v1H9z"></path></svg>
<span><b style="font-weight: 600">בסבב הבא:</b> {{ learned }}</span>
</div>
</sc-if>
<sc-if value="{{ noLearned }}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 13px; color: #625d86">בחירה אחת מספיקה. אפשר גם לדלג.</p>
</sc-if>
</section>

<button style="margin-top: 16px; width: 100%; min-height: 56px; border-radius: 16px; border: 0; background: #b84a57; color: #ffffff; font-size: 18px; font-weight: 500">לשם הבא</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const picked = st.picked || { popular: true };
    const defs = [
      { id: 'popular', label: 'נפוץ מדי', effect: 'פחות שמות מהטופ 40, כמו נגה' },
      { id: 'sound', label: 'לא אוהבים את הצליל', effect: 'פחות שמות עם הצליל של „נגה”' },
      { id: 'meaning', label: 'המשמעות לא מדברת אלינו', effect: 'פחות שמות של אור וזוהר' },
      { id: 'dated', label: 'מיושן', effect: 'יותר שמות עכשוויים' },
      { id: 'boyish', label: 'נשמע כמו שם של בן', effect: 'בלי שמות שרוב הנושאים בהם בנים' },
      { id: 'know', label: 'מישהו שאנחנו מכירים', effect: 'נגה תתווסף לשמות התפוסים' },
      { id: 'other', label: 'אחר…', effect: '' }
    ];
    const on = 'min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid #4f5fb0; background: #4f5fb0; color: #ffffff; font-size: 14px; font-weight: 500; cursor: pointer';
    const off = 'min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid #f0e2dc; background: #ffffff; color: #3a3560; font-size: 14px; font-weight: 500; cursor: pointer';
    const reasons = defs.map((d) => ({
      label: d.label,
      on: !!picked[d.id],
      style: picked[d.id] ? on : off,
      toggle: () => {
        const next = Object.assign({}, picked);
        next[d.id] = !picked[d.id];
        this.setState({ picked: next });
      }
    }));
    const effects = defs.filter((d) => picked[d.id] && d.effect).map((d) => d.effect);
    return {
      reasons: reasons,
      showOther: !!picked.other,
      hasLearned: effects.length > 0,
      noLearned: effects.length === 0,
      learned: effects.join(' · ')
    };
  }
}
</script>
</body>
</html>

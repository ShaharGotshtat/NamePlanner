<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>H2 · סיכום ובחירת המועדף</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Rubik:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff8f4}
button,input{font-family:inherit}
a{color:#4f5fb0}a:hover{color:#3a3560}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 20px 24px; background: #fff8f4; color: #3a3560; font-family: Rubik, system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px; overflow: hidden">

<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-top: 8px">
<div>
<h1 style="margin: 0 0 4px; font-family: Fredoka, Rubik, sans-serif; font-size: 24px; font-weight: 600">4 שמות שאהבתם</h1>
<p style="margin: 0; font-size: 14px; color: #625d86">איזה הכי? אפשר לשנות בכל רגע.</p>
</div>
<svg viewBox="0 0 160 170" width="52" height="55" aria-hidden="true" style="flex-shrink: 0"><g stroke="#ffcf70" stroke-width="12" stroke-linecap="round"><line x1="138" y1="95" x2="150" y2="95"></line><line x1="121.01" y1="136.01" x2="129.5" y2="144.5"></line><line x1="80" y1="153" x2="80" y2="165"></line><line x1="38.99" y1="136.01" x2="30.5" y2="144.5"></line><line x1="22" y1="95" x2="10" y2="95"></line><line x1="38.99" y1="53.99" x2="30.5" y2="45.5"></line><line x1="80" y1="37" x2="80" y2="25"></line><line x1="121.01" y1="53.99" x2="129.5" y2="45.5"></line></g><path d="M80 47 A48 48 0 0 0 80 143 Z" fill="#f7a9a8"></path><path d="M80 47 A48 48 0 0 1 80 143 Z" fill="#a6b8f0"></path><ellipse cx="54" cy="106" rx="8" ry="5.5" fill="#e27c7c" opacity="0.5"></ellipse><ellipse cx="106" cy="106" rx="8" ry="5.5" fill="#e27c7c" opacity="0.5"></ellipse><g fill="#3a3560"><ellipse cx="62" cy="89" rx="6.5" ry="8"></ellipse><ellipse cx="98" cy="89" rx="6.5" ry="8"></ellipse></g><path d="M66 102 Q80 120 94 102 Z" fill="#3a3560"></path></svg>
</div>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">הבחירה הראשונה</legend>
<sc-for list="{{ names }}" as="n" hint-placeholder-count="4">
<label style="{{ n.rowStyle }}">
<input type="radio" name="fav" checked="{{ n.on }}" onChange="{{ n.pick }}" style="width: 20px; height: 20px; margin: 0; accent-color: #b84a57; flex-shrink: 0">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: Fredoka, Rubik, sans-serif; font-size: 24px; font-weight: 600; line-height: 1.2">{{ n.he }}</span>
<span style="font-size: 13px; color: #625d86">{{ n.meaning }}</span>
<sc-if value="{{ n.on }}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; font-weight: 500; color: #9c3846">{{ n.full }}</span></sc-if>
</span>
<sc-if value="{{ n.on }}" hint-placeholder-val="{{ false }}"><span style="flex-shrink: 0; padding: 4px 10px; border-radius: 999px; background: #b84a57; color: #ffffff; font-size: 12px; font-weight: 500">הבחירה הראשונה</span></sc-if>
</label>
</sc-for>
</fieldset>

<a href="#" style="display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; border-radius: 16px; border: 2px dashed #a6b8f0; color: #4f5fb0; font-size: 14px; font-weight: 500; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h11l-3-3M17 17H6l3 3"></path></svg>לא בטוחים? השוואה ראש בראש</a>

<div style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">
<p style="margin: 0"><b style="font-weight: 600">אולי:</b> שני, משי, קשת · <a href="#">עוד מבט</a></p>
<p style="margin: 0"><b style="font-weight: 600">עוד לא ראיתם:</b> 3 שמות מסבב 3 · <a href="#">להציג</a></p>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; gap: 8px">
<button style="flex: 2; min-height: 52px; border-radius: 16px; border: 0; background: #1a7f4b; color: #ffffff; font-size: 16px; font-weight: 500">שליחה בוואטסאפ</button>
<button style="flex: 1; min-height: 52px; border-radius: 16px; border: 2px solid rgba(58,53,96,0.15); background: #ffffff; color: #3a3560; font-size: 15px; font-weight: 500">העתקה</button>
</div>
<button style="min-height: 44px; border: 0; background: none; color: #3a3560; font-size: 14px; text-decoration: underline">עוד סבב של שמות חדשים</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const fav = st.fav || 'agam';
    const list = [
      { id: 'agam', he: 'אֲגַם', meaning: 'מקווה מים גדול ביבשה', full: 'אֲגַם כֹּהֵן' },
      { id: 'hadas', he: 'הֲדַס', meaning: 'שיח ריחני, מארבעת המינים', full: 'הֲדַס כֹּהֵן' },
      { id: 'sheli', he: 'שֶׁלִּי', meaning: 'שייכת לי', full: 'שֶׁלִּי כֹּהֵן' },
      { id: 'shir', he: 'שִׁיר', meaning: 'זמר ומנגינה', full: 'שִׁיר כֹּהֵן' }
    ];
    const names = list.map((n) => ({
      he: n.he,
      meaning: n.meaning,
      full: n.full,
      on: fav === n.id,
      rowStyle: 'display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 14px; border-radius: 18px; cursor: pointer; background: #ffffff; border: 2px solid ' + (fav === n.id ? '#b84a57' : '#f0e2dc'),
      pick: () => this.setState({ fav: n.id })
    }));
    return { names: names };
  }
}
</script>
</body>
</html>

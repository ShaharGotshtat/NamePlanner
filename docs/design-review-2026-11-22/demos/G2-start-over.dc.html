<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>G2 · התחלה מחדש</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Rubik:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff8f4}
button,input{font-family:inherit}
a{color:#9c3846}a:hover{color:#3a3560}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 16px; background: #8f8aa6; color: #3a3560; font-family: Rubik, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; overflow: hidden">

<section role="dialog" aria-modal="true" aria-labelledby="g2-title" style="width: 100%; background: #ffffff; border-radius: 24px; padding: 22px 20px 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 12px 40px rgba(58,53,96,0.25)">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #eaeefc; color: #4f5fb0; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path></svg></span>
<div>
<h1 id="g2-title" style="margin: 0; font-family: Fredoka, Rubik, sans-serif; font-size: 22px; font-weight: 600">התחלה מחדש</h1>
<p style="margin: 0; font-size: 13px; color: #625d86">מה לשמור לסבבים החדשים?</p>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
<label style="{{ it.rowStyle }}">
<input type="checkbox" checked="{{ it.on }}" onChange="{{ it.toggle }}" style="width: 22px; height: 22px; margin: 2px 0 0; accent-color: #4f5fb0; flex-shrink: 0">
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 15px; font-weight: 500">{{ it.title }}</span>
<span style="font-size: 12px; line-height: 17px; color: #625d86">{{ it.detail }}</span>
</span>
</label>
</sc-for>
</div>

<p style="margin: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; color: #625d86"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>הדירוגים מתאפסים תמיד. {{ summary }}</p>

<div style="display: flex; flex-direction: column; gap: 8px">
<button style="min-height: 52px; border-radius: 16px; border: 0; background: #b84a57; color: #ffffff; font-size: 17px; font-weight: 500">התחלה מחדש</button>
<button style="min-height: 48px; border-radius: 16px; border: 2px solid rgba(58,53,96,0.15); background: #ffffff; color: #3a3560; font-size: 15px; font-weight: 500">ביטול</button>
</div>
<p style="margin: 0; text-align: center; font-size: 12px; color: #625d86">למחוק הכול מהמכשיר? <a href="#">מחיקת כל הנתונים</a></p>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const keep = st.keep || { family: true, prefs: true, notes: true, skipped: true, taken: true };
    const defs = [
      { id: 'family', title: 'פרטי המשפחה והתאריך', detail: 'מיכל, יונתן, איתי · כהן · 15.4.2027' },
      { id: 'prefs', title: 'מה חשוב לכם ושמות אהובים', detail: '4 בחירות · מאיה, אלה' },
      { id: 'notes', title: 'הערות ותיקונים מהסבבים', detail: '3 הערות, למשל „פלג נשמע כמו שם של בן”' },
      { id: 'skipped', title: 'שמות שלא תרצו לראות שוב', detail: 'נגה, חלי, פלג, עדן' },
      { id: 'taken', title: 'שמות תפוסים במשפחה', detail: 'תמר' }
    ];
    const items = defs.map((d) => ({
      title: d.title,
      detail: d.detail,
      on: !!keep[d.id],
      rowStyle: 'display: flex; align-items: flex-start; gap: 12px; min-height: 44px; padding: 10px 12px; border-radius: 14px; cursor: pointer; background: ' + (keep[d.id] ? '#f4f6fe' : '#ffffff') + '; border: 1px solid ' + (keep[d.id] ? '#d5dcf6' : '#f0e2dc'),
      toggle: () => { const k = Object.assign({}, keep); k[d.id] = !keep[d.id]; this.setState({ keep: k }); }
    }));
    const dropped = defs.filter((d) => !keep[d.id]).length;
    return {
      items: items,
      summary: dropped === 0 ? 'כל השאר נשמר.' : dropped + ' דברים יימחקו.'
    };
  }
}
</script>
</body>
</html>
